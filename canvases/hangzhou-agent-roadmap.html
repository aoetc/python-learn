<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杭州 Agent 开发工程师 · 大二到毕业</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --panel2:#191d24; --line:#262b33;
    --fg:#e6e8eb; --muted:#9aa3ad; --dim:#6f7883;
    --accent:#4c8dff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .wrap{max-width:1020px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;line-height:1.3;margin:0 0 8px;letter-spacing:.2px}
  h2{font-size:18px;margin:26px 0 10px}
  h3{font-size:15px;margin:20px 0 8px;color:#cfd5dc}
  .sub{color:var(--muted);font-size:13.5px;margin:0}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 6px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);
    padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#3a424d;background:var(--panel2)}
  .btn.primary{border-color:var(--accent);color:#cfe0ff}
  .saved{color:var(--dim);font-size:12px;margin-left:4px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 6px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .stat b{display:block;font-size:20px;font-weight:600;letter-spacing:.3px}
  .stat span{color:var(--muted);font-size:12.5px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
  .pill{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .pill:hover{color:var(--fg);border-color:#3a424d}
  .pill.active{background:#1b2a44;border-color:#365f9e;color:#d5e5ff}
  .pill.done{color:#8fd694;border-color:#2c4a33}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:10px 0}
  .card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
  .card-b{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
  .callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:#111a26;
    border-radius:8px;padding:11px 14px;margin:10px 0;font-size:13.8px;color:#c8d3e0}
  .callout.warn{border-left-color:var(--warn);background:#211a10;color:#e5d3ae}
  .callout.ok{border-left-color:var(--ok);background:#0f1d13;color:#c5e3cb}
  .callout b{display:block;margin-bottom:3px;color:#fff;font-size:13.5px}
  .ck{display:flex;gap:10px;align-items:flex-start;background:none;border:0;color:var(--fg);
    text-align:left;padding:4px 0;cursor:pointer;font:inherit;font-size:13.8px;line-height:1.55}
  .ck .box{flex:0 0 17px;width:17px;height:17px;margin-top:2px;border:1.5px solid #4a525c;border-radius:5px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#0b0d10}
  .ck.on .box{background:var(--ok);border-color:var(--ok)}
  .ck.on .lb{color:var(--dim);text-decoration:line-through;text-decoration-color:#3d444d}
  .divider{height:1px;background:var(--line);margin:6px 0}
  table{width:100%;border-collapse:collapse;font-size:13.4px;margin:8px 0 4px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12.5px;background:#12151a}
  tr:last-child td{border-bottom:0}
  .tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .days{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
  .day-pill{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:4px 10px;border-radius:999px;font-size:12.5px;cursor:pointer}
  .day-pill:hover{color:var(--fg)}
  .day-pill.active{background:#1b2a44;border-color:#365f9e;color:#d5e5ff}
  .day-pill.done{color:#8fd694;border-color:#2c4a33}
  .usage{height:12px;border-radius:999px;overflow:hidden;display:flex;background:#1b2028;margin:10px 0 6px}
  .usage i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .legend em{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .todo{display:flex;gap:9px;align-items:flex-start;font-size:13.4px;padding:6px 0;border-bottom:1px dashed #22262d;cursor:pointer}
  .todo:last-child{border-bottom:0}
  .todo .dot{flex:0 0 16px;width:16px;height:16px;border-radius:50%;border:1.5px solid #4a525c;margin-top:3px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:#0b0d10}
  .todo.done .dot{background:var(--ok);border-color:var(--ok)}
  .todo.done .tx{color:var(--dim);text-decoration:line-through}
  .focus{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .focus .k{color:var(--dim);font-size:12px;margin-top:10px}
  .focus .v{font-size:13.6px}
  .grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  .foot{color:var(--dim);font-size:12.4px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .num{color:var(--accent);font-weight:600}
  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .grid2{grid-template-columns:1fr}
    h1{font-size:21px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button class="btn" id="export">导出 JSON</button>

    <input id="import" type="file" accept=".json,application/json" hidden>
    <span class="saved" id="saved">勾选自动存本机</span>
  </div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

const DAY = D.DAY_SCRIPT;
const STORE = "hz-agent-roadmap-v1";
const DEFAULT_TODOS = D.WEEK_PLAN.map(w => ({id:w.id, content:`${w.week} ${w.dates} · ${w.ship}`, status:"pending"}));

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let S = (() => {
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch(e) {}
  return {
    tab: raw.tab || "start",
    checks: raw.checks || {},
    weekTodos: (raw.weekTodos && raw.weekTodos.length) ? raw.weekTodos : DEFAULT_TODOS.map(x => ({...x})),
    todayDay: raw.todayDay || null,
  };
})();

function save(){
  localStorage.setItem(STORE, JSON.stringify(S));
  const el = document.getElementById("saved");
  el.textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
}
function toggle(id, val){
  S.checks[id] = (val === undefined) ? !S.checks[id] : val;
  save(); render();
}
function nextOpenDay(){ return DAY.find(d => !S.checks["day-"+d.id]) || DAY[DAY.length-1]; }
function dayDone(){ return DAY.filter(d => S.checks["day-"+d.id]).length; }
function tbl(headers, rows, cls){
  return `<div class="tbl-wrap"><table class="${cls||""}"><thead><tr>`
    + headers.map(h => `<th>${esc(h)}</th>`).join("")
    + `</tr></thead><tbody>`
    + rows.map(r => `<tr>` + r.map(c => `<td>${c}</td>`).join("") + `</tr>`).join("")
    + `</tbody></table></div>`;
}
function ck(id, label){
  const on = !!S.checks[id];
  return `<button class="ck ${on?"on":""}" data-toggle="${esc(id)}" role="checkbox" aria-checked="${on}">`
    + `<span class="box">${on?"✓":""}</span><span class="lb">${esc(label)}</span></button>`;
}

}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-toggle],[data-day],[data-todo],#resetTodos");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; save(); render(); return; }
  if (t.dataset.toggle) { toggle(t.dataset.toggle); return; }
  if (t.dataset.day) { S.todayDay = t.dataset.day; save(); render(); return; }
  if (t.dataset.todo) {
    S.weekTodos = S.weekTodos.map(x => x.id === t.dataset.todo
      ? {...x, status: x.status === "completed" ? "pending" : "completed"} : x);
    save(); render(); return;
  }
  if (t.id === "resetTodos") { S.weekTodos = DEFAULT_TODOS.map(x => ({...x})); save(); render(); return; }
});

function canvasJson(){
  return {
    tab: S.tab,
    checks: S.checks,
    "focus-day": nextOpenDay().id,
    "week-todos": S.weekTodos,
    "today-day": S.todayDay || nextOpenDay().id,
    "home-tab": S.tab,
  };
}
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(canvasJson(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hangzhou-agent-roadmap.canvas.data.json";
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(JSON.stringify(canvasJson(), null, 2));
    document.getElementById("saved").textContent = "已复制 JSON"; }
  catch(err){ document.getElementById("saved").textContent = "复制失败，请用导出"; }
};
document.getElementById("import").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    S.checks = j.checks || S.checks;
    S.weekTodos = j["week-todos"] || S.weekTodos;
    S.todayDay = j["today-day"] || S.todayDay;
    S.tab = j["home-tab"] || j.tab || S.tab;
    save(); render();
  } catch(err) { document.getElementById("saved").textContent = "导入失败：不是合法 JSON"; }
};

render();
</script>
