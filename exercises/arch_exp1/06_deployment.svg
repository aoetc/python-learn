<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="490" y="34" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700">图6 部署图 · 购物系统（对照模板重画）</text>

  <g font-family="PingFang SC, sans-serif">
    <!-- WebServer -->
    <polygon points="40,150 52,136 210,136 210,210 198,224 40,224" fill="#f7f7f7" stroke="#222"/>
    <polyline points="198,150 210,136" fill="none" stroke="#222"/>
    <line x1="198" y1="150" x2="198" y2="224" stroke="#222"/>
    <text x="119" y="186" text-anchor="middle" font-size="15">WebServer</text>
    <text x="40" y="250" font-size="13">MiniPreprocessors = 2</text>
    <text x="40" y="270" font-size="13">MiniSpeed = 2.4GHz</text>

    <!-- AppServer -->
    <polygon points="300,110 314,94 620,94 620,300 606,316 300,316" fill="#e8f1fb" stroke="#222"/>
    <polyline points="606,110 620,94" fill="none" stroke="#222"/>
    <line x1="606" y1="110" x2="606" y2="316" stroke="#222"/>
    <text x="460" y="128" text-anchor="middle" font-size="16" font-weight="700">AppServer</text>

    <rect x="360" y="150" width="200" height="40" fill="#fff" stroke="#222"/>
    <text x="460" y="175" text-anchor="middle" font-size="14">ShoppingCart.jar</text>
    <rect x="390" y="230" width="140" height="40" fill="#fff" stroke="#222"/>
    <text x="460" y="255" text-anchor="middle" font-size="14">Order.jar</text>
    <line x1="460" y1="190" x2="460" y2="230" stroke="#222" stroke-dasharray="6 4"/>
    <polygon points="460,230 454,218 466,218" fill="#222"/>

    <!-- DBs -->
    <polygon points="720,150 732,136 920,136 920,200 908,214 720,214" fill="#f7f7f7" stroke="#222"/>
    <polyline points="908,150 920,136" fill="none" stroke="#222"/>
    <line x1="908" y1="150" x2="908" y2="214" stroke="#222"/>
    <text x="814" y="180" text-anchor="middle" font-size="15">DatabaServer1</text>
    <text x="760" y="236" font-size="13">Storage = 1 TB</text>

    <polygon points="720,280 732,266 920,266 920,330 908,344 720,344" fill="#f7f7f7" stroke="#222"/>
    <polyline points="908,280 920,266" fill="none" stroke="#222"/>
    <line x1="908" y1="280" x2="908" y2="344" stroke="#222"/>
    <text x="814" y="310" text-anchor="middle" font-size="15">DatabaServer2</text>
    <text x="760" y="366" font-size="13">Storage = 2 TB</text>
  </g>

  <line x1="210" y1="180" x2="300" y2="180" stroke="#222" stroke-width="1.4"/>
  <text x="228" y="170" font-family="PingFang SC, sans-serif" font-size="14">«RMI»</text>

  <polyline points="620,190 700,190 700,175 720,175" fill="none" stroke="#222" stroke-width="1.4"/>
  <polyline points="700,190 700,300 720,300" fill="none" stroke="#222" stroke-width="1.4"/>
  <text x="640" y="180" font-family="PingFang SC, sans-serif" font-size="14">«JDBC»</text>
</svg>
