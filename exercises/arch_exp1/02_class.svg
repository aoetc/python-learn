<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <rect width="100%" height="100%" fill="#fff"/>
  <text x="460" y="36" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="20" font-weight="700">图2 类图 · 电商（对照模板重画）</text>

  <g font-family="PingFang SC, sans-serif" font-size="15">
    <rect x="400" y="60" width="120" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="460" y="92" text-anchor="middle">User</text>

    <rect x="80" y="190" width="140" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="150" y="222" text-anchor="middle">Customer</text>
    <rect x="390" y="190" width="160" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="470" y="222" text-anchor="middle">SystemManager</text>
    <rect x="700" y="190" width="140" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="770" y="222" text-anchor="middle">Accountant</text>

    <rect x="90" y="330" width="120" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="150" y="362" text-anchor="middle">Order</text>
    <rect x="80" y="450" width="140" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="150" y="482" text-anchor="middle">OrderItem</text>
    <rect x="90" y="560" width="120" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="150" y="592" text-anchor="middle">Product</text>

    <rect x="360" y="330" width="150" height="52" fill="#f4f4f4" stroke="#222"/>
    <text x="435" y="362" text-anchor="middle">BankService</text>
  </g>

  <!-- inheritance: hollow triangle at User -->
  <g stroke="#222" fill="none" stroke-width="1.4">
    <polygon points="460,112 452,128 468,128"/>
    <line x1="150" y1="190" x2="150" y2="150"/>
    <line x1="470" y1="190" x2="470" y2="150"/>
    <line x1="770" y1="190" x2="770" y2="150"/>
    <line x1="150" y1="150" x2="770" y2="150"/>
    <line x1="460" y1="128" x2="460" y2="150"/>
  </g>
  <text x="300" y="144" font-family="PingFang SC, sans-serif" font-size="13">Extends</text>

  <g stroke="#222" fill="none" stroke-width="1.4">
    <line x1="150" y1="242" x2="150" y2="330"/>
    <line x1="150" y1="382" x2="150" y2="450"/>
    <line x1="150" y1="502" x2="150" y2="560"/>
  </g>

  <!-- dependency -->
  <line x1="210" y1="356" x2="360" y2="356" stroke="#222" stroke-width="1.4" stroke-dasharray="7 5"/>
  <polygon points="360,356 348,350 348,362" fill="#222"/>
  <text x="250" y="346" font-family="PingFang SC, sans-serif" font-size="13">Use</text>

  <text x="500" y="560" font-family="PingFang SC, sans-serif" font-size="14">
    <tspan x="500" dy="0">空心三角 = 继承</tspan>
    <tspan x="500" dy="22">实线 = 有联系</tspan>
    <tspan x="500" dy="22">虚线箭头 = 依赖（Use）</tspan>
  </text>
</svg>
